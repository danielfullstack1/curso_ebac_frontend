<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="main.css"> <!-- Link para o arquivo CSS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- jQuery -->
</head>
<body>
    <h1>Lista de Tarefas</h1>
    <!-- Formulário para adicionar tarefas -->
    <form id="task-form">
        <input type="text" id="task-name" placeholder="Digite a tarefa" required>
        <button type="submit">Cadastrar</button>
    </form>

    <!-- Lista onde as tarefas serão exibidas -->
    <ul id="task-list"></ul>

    <script src="main.js"></script> <!-- Link para o arquivo JavaScript -->
</body>
</html>
